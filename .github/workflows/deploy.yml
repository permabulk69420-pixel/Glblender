name: Deploy Glblender
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check editor in Chromium
        run: node tests/browser-smoke.mjs
      - name: Save browser screenshots and test details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
